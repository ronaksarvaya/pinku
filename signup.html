<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - AI Virtual Try-On</title>
  <meta name="description" content="Create your AI Virtual Try-On account and start your styling journey." />
  <link rel="stylesheet" href="style/signup.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <div class="signup-container">
    <div class="brand-header">
      <span class="brand-icon">✨</span>
      <h1>AI Virtual Try-On</h1>
    </div>
    <div class="form-box">
      <h2>Create Account</h2>
      <form id="signup-form">
        <div class="input-group">
          <input type="text" id="fullname" placeholder=" " required />
          <label for="fullname">Full Name</label>
        </div>
        <div class="input-group">
          <input type="email" id="email" placeholder=" " required />
          <label for="email">Email</label>
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder=" " required />
          <label for="password">Password</label>
        </div>
        <button type="submit" class="btn">Sign Up</button>
      </form>
      <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <p class="loading-text">Please wait...</p>
  </div>

  <script type="module" src="js/signup.js"></script>
</body>

</html>
